<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="dgrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)" />

  <!-- heartbeat background (brighter + glow, behind the D) -->
  <g transform="translate(10,34) scale(0.8)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 36 L18 36 L24 20 L30 48 L38 4 L46 48 L52 20 L58 36 L86 36" stroke="#ffffff" stroke-width="10" stroke-opacity="0.14" filter="url(#glow)"/>
    <path d="M2 36 L18 36 L24 20 L30 48 L38 4 L46 48 L52 20 L58 36 L86 36" stroke="#ffffff" stroke-width="5" stroke-opacity="0.95"/>
  </g>

  <!-- Highlighted capital D centered -->
  <text x="50" y="62" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="46" fill="url(#dgrad)" stroke="#ffffff" stroke-width="1">
    D
  </text>

  <!-- subtle glow ring behind D to emphasize it -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="8" />

  <title>DevyoraMEDai logo — highlighted D with heartbeat</title>
</svg>
